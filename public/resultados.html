<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fbff" />
    <title>Resultados · Material especializado YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resultados.css?v=20260925d7" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="scene-photo"></div>
      <div class="scene-overlay"></div>
    </div>

    <header class="topbar">
      <div class="brand-block">
        <img
          src="./assets/logo-yaavs.png"
          alt="YAAVS"
          width="160"
          height="56"
          class="brand-logo"
        />
        <div>
          <h1>Solicitudes de material especializado</h1>
          <p class="live-line">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="liveStatus">Conectando…</span>
          </p>
        </div>
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="./api/export.xlsx">Exportar Excel</a>
        <a class="ghost-link" href="./api/export.csv">CSV</a>
        <a class="ghost-link primary-link" href="./">Nueva solicitud</a>
      </div>
    </header>

    <main class="layout">
      <section class="stats" id="stats" aria-label="Resumen"></section>
      <nav class="material-filters" id="materialFilters" aria-label="Filtrar por material">
        <button type="button" class="material-filter is-active" data-filter="all">
          Todos <span class="filter-count" data-count="all">0</span>
        </button>
        <button type="button" class="material-filter" data-filter="lona">
          Lona <span class="filter-count" data-count="lona">0</span>
        </button>
        <button type="button" class="material-filter" data-filter="toldo">
          Toldo <span class="filter-count" data-count="toldo">0</span>
        </button>
        <button type="button" class="material-filter" data-filter="caballete">
          Caballete <span class="filter-count" data-count="caballete">0</span>
        </button>
        <button type="button" class="material-filter" data-filter="rotulacion">
          Rotulación <span class="filter-count" data-count="rotulacion">0</span>
        </button>
      </nav>
      <div class="board-shell">
        <aside class="request-list" id="requestList" aria-label="Lista de solicitudes"></aside>
        <section class="detail" id="detail" aria-live="polite"></section>
      </div>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Cerrar">×</button>
      <button type="button" class="lightbox-nav prev" id="lightboxPrev" aria-label="Anterior">‹</button>
      <figure class="lightbox-frame">
        <img id="lightboxImg" alt="" />
        <figcaption id="lightboxCaption"></figcaption>
      </figure>
      <button type="button" class="lightbox-nav next" id="lightboxNext" aria-label="Siguiente">›</button>
    </div>

    <script src="./resultados.js?v=20260925d7" defer></script>
  </body>
</html>
