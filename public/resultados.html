<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fbff" />
    <title>Resultados · Material especializado YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resultados.css?v=20261110f" />
  </head>
  <!-- Hecho por Jordy Dylan Rivera Lopez -->
  <body data-maker="Jordy Dylan Rivera Lopez" class="dashboard-centro" data-dashboard="centro">
    <div class="atmosphere" aria-hidden="true">
      <div class="scene-photo"></div>
      <div class="scene-overlay"></div>
    </div>

    <header class="topbar">
      <div class="brand-block">
        <img
          src="./assets/logo-yaavs.png"
          alt="YAAVS"
          width="160"
          height="56"
          class="brand-logo"
        />
        <div>
          <p class="dashboard-kicker" id="dashboardKicker">Dashboard Centro</p>
          <h1 id="dashboardTitle">Solicitudes de material especializado</h1>
          <p class="live-line">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="liveStatus">Conectando…</span>
          </p>
        </div>
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="./api/export.xlsx">Exportar Excel</a>
        <a class="ghost-link" href="./api/export.csv">CSV</a>
        <a class="ghost-link primary-link" href="./">Nueva solicitud</a>
        <span class="role-chip" id="roleChip" hidden></span>
        <button type="button" class="ghost-link" id="logoutBtn">Salir</button>
      </div>
    </header>

    <main class="layout">
      <section class="stats" id="stats" aria-label="Resumen"></section>
      <div class="board-search" id="boardSearch">
        <div class="board-search-wrap">
          <label class="board-search-field" for="searchQuery">
            <span>Buscar</span>
            <input
              type="search"
              id="searchQuery"
              placeholder="Folio, punto de venta, yaavser, clave…"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="searchSuggestions"
              aria-expanded="false"
            />
          </label>
          <ul
            class="search-suggestions"
            id="searchSuggestions"
            role="listbox"
            aria-label="Coincidencias"
            hidden
          ></ul>
        </div>
        <button type="button" class="board-search-clear" id="searchClear" hidden>Limpiar</button>
      </div>
      <section class="zone-dashboard" id="zoneDashboard" aria-label="Dashboard por zona" hidden>
        <p class="zone-dashboard-label">Dashboard</p>
        <nav class="zone-dashboard-tabs" id="zoneDashboardTabs" aria-label="Centro o Foráneo">
          <button type="button" class="zone-tab is-active" data-zone="centro">Centro</button>
          <button type="button" class="zone-tab" data-zone="foraneo">Foráneo</button>
          <button type="button" class="zone-tab" data-zone="all">Ambos</button>
        </nav>
      </section>
      <section class="filter-panel" id="filterPanel" aria-label="Filtros del tablero">
        <div class="filter-panel-top">
          <p class="filter-panel-label">Vista</p>
          <nav class="board-buckets" id="boardBuckets" aria-label="Activas o terminadas"></nav>
        </div>
        <div class="filter-grid" id="filterGrid">
          <label class="filter-field" id="materialFilterField">
            <span>Material</span>
            <select id="materialSelect" aria-label="Filtrar por material"></select>
          </label>
          <label class="filter-field" id="quickFilterField">
            <span>Autorización</span>
            <select id="quickSelect" aria-label="Filtrar por autorización"></select>
          </label>
          <label class="filter-field" id="statusFilterField" hidden>
            <span>Estado</span>
            <select id="statusSelect" aria-label="Filtrar por estado"></select>
          </label>
          <label class="filter-field">
            <span>Desde</span>
            <input type="date" id="dateFromFilter" />
          </label>
          <label class="filter-field">
            <span>Hasta</span>
            <input type="date" id="dateToFilter" />
          </label>
          <button type="button" class="date-filter-clear" id="dateFilterClear" hidden>Quitar fechas</button>
        </div>
      </section>
      <div class="board-shell">
        <aside class="request-list" id="requestList" aria-label="Lista de solicitudes"></aside>
        <section class="detail" id="detail" aria-live="polite"></section>
      </div>
      <p class="maker-mark" aria-hidden="true" title="">Hecho por Jordy Dylan Rivera Lopez</p>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Cerrar">×</button>
      <button type="button" class="lightbox-nav prev" id="lightboxPrev" aria-label="Anterior">‹</button>
      <figure class="lightbox-frame">
        <img id="lightboxImg" alt="" />
        <figcaption id="lightboxCaption"></figcaption>
        <a class="lightbox-download" id="lightboxDownload" href="#" target="_blank" rel="noopener">Descargar imagen</a>
      </figure>
      <button type="button" class="lightbox-nav next" id="lightboxNext" aria-label="Siguiente">›</button>
    </div>

    <script src="./resultados.js?v=20261110f" defer></script>
  </body>
</html>
